name: Build gateway image

# 构建并推送网关镜像到 GitHub Container Registry
# 产物：ghcr.io/xiaoyugesvg/catjar:latest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'jars/**'
      - 'config/**'
      - '.github/workflows/docker-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/xiaoyugesvg/catjar:latest
            ghcr.io/xiaoyugesvg/catjar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -e
          docker run -d --name gw-smoke -p 18080:8080 \
            -e GATEWAY_TOKEN=smoke \
            -e PUBLIC_BASE_URL=http://127.0.0.1:18080 \
            ghcr.io/xiaoyugesvg/catjar:latest
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          echo "--- health"
          cat /tmp/health.json || true
          echo
          echo "--- demo home"
          curl -fsS "http://127.0.0.1:18080/demo?ac=class&token=smoke" > /tmp/home.json || true
          head -c 300 /tmp/home.json || true
          echo
          echo "--- logs"
          docker logs gw-smoke || true
          docker rm -f gw-smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ]
