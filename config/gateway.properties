# ===== 基础参数 =====
# 对外端口（容器内；宿主机映射到 127.0.0.1:18080）
port=8080
# 单次 spider 调用的超时（秒）
timeout.seconds=25
# 缓存（秒），0 = 关闭
cache.class.seconds=300
cache.list.seconds=60
cache.detail.seconds=600
# 播放结果带 headers 时是否由网关代理流（false = 直接 302，可能缺少 Referer/UA）
play.proxy=true

# 对外地址；留空则按请求的 Host / X-Forwarded-Proto 推断
public.baseUrl=

# ===== 源 =====
# 一个源一个 key：site.<key>.className / site.<key>.ext
# className 必须是 custom_spider.jar 里的全限定类名
site.douban.className=com.github.catvod.spider.Douban
site.douban.ext=

# 例：
# site.ali.className=com.github.catvod.spider.Ali
# site.ali.ext={"token":"xxx"}
